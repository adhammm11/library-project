<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .custom-container {
            max-width: 800px;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg bg-light"> <!--Navigation bar that collapses into icon-->

    <div class="container">
        <img src="logo.webp" alt="logo" width="100" height="50">
      <a class="navbar-brand text-#f14d24"  id="title">TKH Library</a>

      <button class="navbar-toggler" type="button"
            data-bs-toggle="collapse" data-bs-target="#marketNav"
            aria-controls="marketNav" aria-expanded="false" aria-label="Toggle navigation">

        <span class="navbar-toggler-icon"></span>
      </button>


      <div class="collapse navbar-collapse" id="marketNav">
          <ul class="navbar-nav me-auto">
            <li class="nav-item"><a class="nav-link active" href="index.html">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="catalog.html">Catalog</a></li>
            <li class="nav-item"><a class="nav-link" href="checkout form.html">Checkout</a></li>
          </ul>
        </div>
    </div>
    </nav>
          
                                        <!-- checkout form format -->
    <div class="container custom-container mt-5">
        <h2 class="mb-4">Checkout Form</h2> 
        <form>
            <div class="mb-3">        <!-- person's name -->
                <label for="name" class="form-label">Name</label>
                <input type="text" class="form-control" id="name" placeholder="Enter your name" required>
            </div>
            <div class="mb-3">    <!-- person's ID -->
                <label for="ID" class="form-label">ID</label>
                <input type="ID" class="form-control" id="ID" placeholder="Enter your ID" required>
            </div>
            <div class="mb-3">     <!-- Book name  -->
                <label for="Book name" class="form-label">Book name</label>
                <input type="Book name" class="form-control" id="address" placeholder="Enter Book name" required>
            </div>
            <div class="mb-3">     <!-- Book IBSN  -->
                <label for="city" class="form-label">Book IBSN</label>
                <input type="text" class="form-control" id="Book IBSN" placeholder="Enter Book IBSN" required>
            </div>
            <button type="submit" class="btn btn-primary">Submit</button>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
</body>
</html>
