<head>

<body>

  <nav class="navbar navbar-expand-lg bg-light"> <!--Navigation bar that collapses into icon-->

          <ul class="navbar-nav me-auto">

  <!--Carousel images-->
  <div id="carouselExampleAutoplaying" class="carousel slide custom-carousel" data-bs-ride="carousel">
  <div class="carousel-inner">

    <div class="carousel-item">
      <img src="WhatsApp Image 2023-09-17 at 21.04.27.jpeg" class="d-block w-100" alt="...">
    </div>

    <div class="carousel-item active">
      <img src="WhatsApp Image 2023-09-09 at 15.03.35 (2).jpeg" class="d-block w-100" alt="Library photo 1">
    </div>

    <div class="carousel-item">
      <img src="WhatsApp Image 2023-09-09 at 15.03.35 (3).jpeg" class="d-block w-100" alt="Library photo 2">

    <div class="carousel-item">
      <img src="WhatsApp Image 2023-09-09 at 15.03.36 (1).jpeg" class="d-block w-100" alt="Library photo 3">
    </div>

    <div class="carousel-item">
      <img src="WhatsApp Image 2023-09-09 at 15.03.36 (2).jpeg" class="d-block w-100" alt="...">
    </div>

      <img src="WhatsApp Image 2023-09-09 at 15.03.36 (3).jpeg" class="d-block w-100" alt="...">

      <img src="WhatsApp Image 2023-09-09 at 15.03.37.jpeg" class="d-block w-100" alt="...">
    </div>

    
  </div>

    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
    <span class="visually-hidden">Previous</span>
  </button>
  <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleAutoplaying" data-bs-slide="next">
    <span class="carousel-control-next-icon" aria-hidden="true"></span>
    <span class="visually-hidden">Next</span>
  </button>
</div>

<!--New part--> 
<div class="text-center" style="margin-top: 50px;">
  <input type="text" class="form-control w-50 mx-auto" placeholder="Search for books..." id="searchInput">
  <button class="btn btn-primary mt-2">Search</button>
</div>

  <main class="container my-4"> 
    <div class="mb-4">
      <h1>Welcome to the TKH Library</h1>
      <p>Your place to study, read, and learn.</p>
    </div>

    <section class="row"> <!--New Arrivals-->
      <h2 class="mb-2">New Arrivals</h2>
      <div class="card p-3 mb-2">
        <img src="book1.webp" height="200" width="100">
        <p>Book Title</p>
        <p class="text-secondary">Available</p>
      </div>

      <!--Library Hours-->                      <!--New part-->
      <div class="row">
      <div class ="col-lg-4 col-md-6 col-sm-12 mx-auto" id="library-hours">
      <div class="card shadow-sm border-0 border-top border-primary border-4 bg-light">
        <div class="card-body">
          <h2 class="card-title text-center text-primary mb-4">Library Hours 
            <i class="bi bi-clock-history"></i>
          </h2>
          <p class="text-center">Monday - Friday: 8:00 AM - 6:00 PM</p>
          <p class="text-center">Saturday: 9:00 AM - 5:00 PM</p>
          <p class="text-center">Sunday: Closed</p>
        </div>
      </div>

      </div>
      </div>
      
    </section>


  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
